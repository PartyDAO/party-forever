# fly.toml app configuration file for party-db-api
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'party-db-api'
primary_region = 'lax'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    soft_limit = 400
    hard_limit = 500

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    timeout = '5s'
    path = '/-/versions'

[[vm]]
  size = 'shared-cpu-2x'
  memory = '1gb'
